name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run unit and integration test suite
        run: pytest --cov=src --cov-report=term-missing

      - name: Run CLI end-to-end demo smoke check
        run: |
          python main.py --mode demo --date 2026-11-20 --draft-emails --write-html
          python main.py stats
          test -f output/leads_updated.csv
          test -f output/leads_enriched_crm.csv
          test -f output/followups_today.csv
          test -f output/pipeline_report.md
