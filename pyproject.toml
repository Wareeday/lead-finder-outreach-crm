[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-finder-outreach-crm"
version = "2.0.0"
description = "Production-grade B2B lead discovery, website enrichment, scoring, multi-step follow-up sequencing, and outreach CRM."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["crm", "lead-generation", "outreach", "automation", "openstreetmap", "google-sheets"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
integrations = [
    "python-dotenv>=1.0.1",
    "gspread>=6.1.2",
    "google-auth>=2.35.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
lead-crm = "main:main"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
